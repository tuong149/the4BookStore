<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="common_head(pageTitle)">
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title th:text="${pageTitle}">The4BookStore - Hiệu Sách Độc Lập</title>
    
    <!-- Google Fonts: Be Vietnam Pro & Inter for native Vietnamese typography -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&amp;family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;display=swap" rel="stylesheet"/>
    
    <!-- Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    
    <!-- Tailwind CSS with Forest Folio Palette & Extended Border Radius Scale -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#004c22",
                        "primary-container": "#166534",
                        "on-primary": "#ffffff",
                        "on-primary-container": "#93e0a2",
                        "secondary": "#904d00",
                        "secondary-container": "#fe932c",
                        "on-secondary": "#ffffff",
                        "tertiary": "#004b32",
                        "tertiary-container": "#006545",
                        "on-tertiary": "#ffffff",
                        "background": "#f9f9ff",
                        "on-background": "#141b2b",
                        "surface": "#f9f9ff",
                        "surface-bright": "#f9f9ff",
                        "surface-dim": "#d3daef",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#f1f3ff",
                        "surface-container": "#e9edff",
                        "surface-container-high": "#e1e8fd",
                        "surface-container-highest": "#dce2f7",
                        "on-surface": "#141b2b",
                        "on-surface-variant": "#404940",
                        "outline": "#707a6f",
                        "outline-variant": "#bfc9bd",
                        "error": "#ba1a1a",
                        "error-container": "#ffdad6"
                    },
                    borderRadius: {
                        "none": "0px",
                        "xs": "0.25rem",
                        "sm": "0.375rem",
                        "DEFAULT": "0.5rem",
                        "md": "0.625rem",
                        "lg": "0.75rem",
                        "xl": "1rem",
                        "2xl": "1.25rem",
                        "3xl": "1.5rem",
                        "4xl": "2rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "space-xs": "0.25rem",
                        "space-sm": "0.5rem",
                        "space-md": "1rem",
                        "space-lg": "1.5rem",
                        "space-xl": "2rem",
                        "margin": "1rem",
                        "margin-desktop": "2rem"
                    },
                    fontFamily: {
                        sans: ["'Be Vietnam Pro'", "'Inter'", "system-ui", "-apple-system", "sans-serif"],
                        "body-md": ["'Be Vietnam Pro'", "'Inter'", "sans-serif"],
                        "headline-sm": ["'Be Vietnam Pro'", "sans-serif"],
                        "headline-md": ["'Be Vietnam Pro'", "sans-serif"],
                        "headline-lg": ["'Be Vietnam Pro'", "sans-serif"],
                        "headline-xl": ["'Be Vietnam Pro'", "sans-serif"]
                    }
                }
            }
        };
    </script>
    <style>
        @layer base {
            html, body {
                font-family: 'Be Vietnam Pro', 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                margin: 0;
                padding: 0;
            }
            input, select, textarea, button {
                font-family: inherit;
            }
            body { overscroll-behavior: none; }
        }
                /* Thanh cuộn ngang luôn hiển thị rõ nét để người dùng chuột có thể kéo qua */
        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            display: none;
            width: 0;
        }

        .carousel-track,
        .horizontal-scroll-category,
        .admin-table-scroll,
        .overflow-x-auto,
        [class*="overflow-x-auto"] {
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: #94a3b8 #f1f5f9;
        }

        .carousel-track::-webkit-scrollbar,
        .horizontal-scroll-category::-webkit-scrollbar,
        .admin-table-scroll::-webkit-scrollbar,
        .overflow-x-auto::-webkit-scrollbar,
        [class*="overflow-x-auto"]::-webkit-scrollbar {
            display: block !important;
            height: 8px !important;
        }

        .carousel-track::-webkit-scrollbar-track,
        .horizontal-scroll-category::-webkit-scrollbar-track,
        .admin-table-scroll::-webkit-scrollbar-track,
        .overflow-x-auto::-webkit-scrollbar-track,
        [class*="overflow-x-auto"]::-webkit-scrollbar-track {
            background: #f1f5f9 !important;
            border-radius: 9999px !important;
        }

        .carousel-track::-webkit-scrollbar-thumb,
        .horizontal-scroll-category::-webkit-scrollbar-thumb,
        .admin-table-scroll::-webkit-scrollbar-thumb,
        .overflow-x-auto::-webkit-scrollbar-thumb,
        [class*="overflow-x-auto"]::-webkit-scrollbar-thumb {
            background: #94a3b8 !important;
            border-radius: 9999px !important;
            cursor: grab;
        }

        .carousel-track::-webkit-scrollbar-thumb:hover,
        .horizontal-scroll-category::-webkit-scrollbar-thumb:hover,
        .admin-table-scroll::-webkit-scrollbar-thumb:hover,
        .overflow-x-auto::-webkit-scrollbar-thumb:hover,
        [class*="overflow-x-auto"]::-webkit-scrollbar-thumb:hover {
            background: #004c22 !important;
        }

        .carousel-track::-webkit-scrollbar-thumb:active,
        .horizontal-scroll-category::-webkit-scrollbar-thumb:active,
        .admin-table-scroll::-webkit-scrollbar-thumb:active,
        .overflow-x-auto::-webkit-scrollbar-thumb:active,
        [class*="overflow-x-auto"]::-webkit-scrollbar-thumb:active {
            background: #003316 !important;
            cursor: grabbing;
        }
        /* Dual Range Slider Styles */
        .price-slider-input {
            pointer-events: none !important;
            height: 0 !important;
            outline: none !important;
        }
        .price-slider-input::-webkit-slider-thumb {
            pointer-events: auto !important;
            -webkit-appearance: none !important;
            appearance: none !important;
            width: 18px !important;
            height: 18px !important;
            border-radius: 50% !important;
            background: #004c22 !important;
            border: 2.5px solid #ffffff !important;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3) !important;
            cursor: grab !important;
            transition: transform 0.1s ease;
        }
        .price-slider-input::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }
        .price-slider-input::-webkit-slider-thumb:active {
            cursor: grabbing !important;
            transform: scale(1.25);
        }
        .price-slider-input::-moz-range-thumb {
            pointer-events: auto !important;
            width: 18px !important;
            height: 18px !important;
            border-radius: 50% !important;
            background: #004c22 !important;
            border: 2.5px solid #ffffff !important;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3) !important;
            cursor: grab !important;
        }
        .price-slider-input::-moz-range-thumb:active {
            cursor: grabbing !important;
            transform: scale(1.25);
        }
    </style>
    <!-- SockJS & STOMP Client for Real-time Notifications -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        :root {
            /* Override Bootstrap Variables with Tailwind Forest Folio Palette */
            --bs-primary: #004c22;
            --bs-primary-rgb: 0, 76, 34;
            --bs-secondary: #904d00;
            --bs-secondary-rgb: 144, 77, 0;
            --bs-font-sans-serif: 'Be Vietnam Pro', 'Inter', system-ui, sans-serif;
            --bs-border-radius: 0.5rem;
        }
        .btn-primary { --bs-btn-bg: var(--bs-primary); --bs-btn-border-color: var(--bs-primary); --bs-btn-hover-bg: #166534; --bs-btn-hover-border-color: #166534; }
        .table { --bs-table-bg: transparent; }

        /* Đảm bảo tương phản icon và text khi hover/active/click đè lên Bootstrap !important */
        .group:hover .group-hover\:text-on-primary,
        .group:active .group-hover\:text-on-primary,
        .group:focus .group-hover\:text-on-primary,
        .group:hover .group-hover\:text-white,
        .group:active .group-hover\:text-white,
        .group:focus .group-hover\:text-white,
        .cat-card-item:hover .cat-card-icon,
        .cat-card-item:active .cat-card-icon,
        .cat-card-item:focus .cat-card-icon,
        .nav-all-cat-btn:hover,
        .nav-all-cat-btn:active,
        .nav-all-cat-btn:focus {
            background-color: var(--bs-primary) !important;
            color: #ffffff !important;
        }
        .cat-card-item:hover .cat-card-icon span,
        .cat-card-item:active .cat-card-icon span,
        .cat-card-item:focus .cat-card-icon span,
        .cat-card-item:hover .cat-card-icon .material-symbols-outlined,
        .cat-card-item:active .cat-card-icon .material-symbols-outlined,
        .cat-card-item:focus .cat-card-icon .material-symbols-outlined,
        .nav-all-cat-btn:hover *,
        .nav-all-cat-btn:active *,
        .nav-all-cat-btn:focus * {
            color: #ffffff !important;
        }

        /* Hỗ trợ toàn cục các nút hoặc link có hover/active sang text trắng để đè Bootstrap !important */
        a[class*="hover:text-white"]:hover,
        a[class*="hover:text-white"]:active,
        button[class*="hover:text-white"]:hover,
        button[class*="hover:text-white"]:active,
        a[class*="hover:text-on-primary"]:hover,
        a[class*="hover:text-on-primary"]:active,
        button[class*="hover:text-on-primary"]:hover,
        button[class*="hover:text-on-primary"]:active {
            color: #ffffff !important;
        }
        a[class*="hover:text-white"]:hover *,
        a[class*="hover:text-white"]:active *,
        button[class*="hover:text-white"]:hover *,
        button[class*="hover:text-white"]:active *,
        a[class*="hover:text-on-primary"]:hover *,
        a[class*="hover:text-on-primary"]:active *,
        button[class*="hover:text-on-primary"]:hover *,
        button[class*="hover:text-on-primary"]:active * {
            color: #ffffff !important;
        }
    </style>
</head>
<body></body>
</html>
