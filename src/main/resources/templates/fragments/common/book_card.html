<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<body>

    <!-- Reusable Book Card Component Fragment -->
    <article th:fragment="book_card(book)"
        class="bg-surface-container-lowest rounded-2xl p-space-md border border-surface-container shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col group hover:-translate-y-1">
        <!-- Book Cover Image Wrapper -->
        <div class="aspect-[3/4] w-full rounded-xl overflow-hidden bg-surface-container relative mb-space-sm shadow-xs">
            <img th:if="${book.hinhAnh != null and !book.hinhAnh.isEmpty()}" 
                 th:src="${book.hinhAnh}"
                 th:alt="${book.tenSP}"
                 class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
            <img th:unless="${book.hinhAnh != null and !book.hinhAnh.isEmpty()}"
                 src="https://lh3.googleusercontent.com/aida-public/AB6AXuAJxhxEUoGYZXYaOldMaT7d3dcCRrYvCD-3AWG8q4nOBMKeBIhtPi1dKb9NiDZHTXWMxMULBn3rsm5dU8_IVOjwK8Bnkg8xf-IGsBbsQoLtc5D6EWqcU1KfQ1LzI9jMW8JHZBBy9sHF_7t1onS8pagaubUOfOqYifnPkQMRgKeMgWgWQ71XMqmHdC9fJzuMiB3aqbLZt8bE5qj4HVtt62KzVUKztkjut685dS6dOCMbTJ_WPnz-9N7y"
                 th:alt="${book.tenSP}"
                 class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />

            <!-- Category Badge overlay -->
            <span th:if="${book.danhMuc != null}" th:text="${book.danhMuc.tenDanhMuc}"
                class="absolute top-2 left-2 px-2.5 py-0.5 rounded-full bg-surface-container-lowest/90 backdrop-blur-sm text-[11px] font-bold text-primary shadow-xs">
                Văn học
            </span>

            <!-- Stock status indicator -->
            <span th:if="${book.soLuongTon != null and book.soLuongTon <= 5 and book.soLuongTon > 0}"
                class="absolute top-2 right-2 px-2 py-0.5 rounded-full bg-secondary text-on-secondary text-[10px] font-bold shadow-xs">
                Chỉ còn <span th:text="${book.soLuongTon}"></span> cuốn
            </span>
        </div>

        <!-- Book Meta -->
        <div class="flex-1 flex flex-col justify-between">
            <div>
                <h3 th:text="${book.tenSP}"
                    class="font-headline-sm text-sm font-bold text-on-surface line-clamp-2 leading-tight group-hover:text-primary transition-colors">
                    Tên Sách Tuyển Chọn
                </h3>
                <p class="text-xs text-on-surface-variant mt-1 line-clamp-1">
                    <span th:if="${book.nhaXuatBan != null}" th:text="${book.nhaXuatBan.tenNXB}">Nhà Xuất Bản</span>
                    <span th:unless="${book.nhaXuatBan != null}">Tác giả tuyển chọn</span>
                </p>
            </div>

            <!-- Price & Buy Action -->
            <div class="pt-3 mt-2 border-t border-surface-container-low flex items-center justify-between">
                <div>
                    <span class="text-[10px] text-outline block">Giá niêm yết</span>
                    <span th:text="${book.giaBan != null ? #numbers.formatDecimal(book.giaBan, 0, 'POINT', 0, 'COMMA') + ' đ' : '189.000 đ'}"
                        class="font-mono font-bold text-sm text-primary">
                        189.000 đ
                    </span>
                </div>
                <a th:href="@{/gio-hang}"
                    class="p-2 rounded-xl bg-surface-container text-primary hover:bg-primary hover:text-on-primary transition-all shadow-xs flex items-center justify-center"
                    title="Thêm vào giỏ hàng">
                    <span class="material-symbols-outlined text-[18px]">add_shopping_cart</span>
                </a>
            </div>
        </div>
    </article>

</body>

</html>
