<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<body>

    <!-- Reusable Book Card Component Fragment -->
    <article th:fragment="book_card(book)"
        th:data-category="${book.danhMuc != null ? book.danhMuc.tenDanhMuc : ''}"
        class="bg-surface-container-lowest rounded-2xl p-space-md border border-surface-container shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col justify-between group hover:-translate-y-1 h-full">
        <!-- Book Cover Image Wrapper -->
        <a th:href="@{/san-pham/{id}(id=${book.maSP})}" class="aspect-[3/4] w-full rounded-xl overflow-hidden bg-surface-container relative mb-space-sm shadow-xs block shrink-0">
            <img th:if="${book.hinhAnh != null and !book.hinhAnh.isEmpty()}" 
                 th:src="${book.hinhAnh}" 
                 th:alt="${book.tenSP}"
                 th:classappend="${book.trangThai == 'HetHang' or book.soLuongTon == null or book.soLuongTon <= 0} ? 'opacity-75' : ''"
                 class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
            <img th:unless="${book.hinhAnh != null and !book.hinhAnh.isEmpty()}"
                 src="https://lh3.googleusercontent.com/aida-public/AB6AXuAJxhxEUoGYZXYaOldMaT7d3dcCRrYvCD-3AWG8q4nOBMKeBIhtPi1dKb9NiDZHTXWMxMULBn3rsm5dU8_IVOjwK8Bnkg8xf-IGsBbsQoLtc5D6EWqcU1KfQ1LzI9jMW8JHZBBy9sHF_7t1onS8pagaubUOfOqYifnPkQMRgKeMgWgWQ71XMqmHdC9fJzuMiB3aqbLZt8bE5qj4HVtt62KzVUKztkjut685dS6dOCMbTJ_WPnz-9N7y"
                 th:alt="${book.tenSP}"
                 th:classappend="${book.trangThai == 'HetHang' or book.soLuongTon == null or book.soLuongTon <= 0} ? 'opacity-75' : ''"
                 class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />

            <!-- Category Badge overlay -->
            <span th:if="${book.danhMuc != null}" th:text="${book.danhMuc.tenDanhMuc}"
                th:classappend="${(book.trangThai != 'HetHang' and book.soLuongTon != null and book.soLuongTon <= 5 and book.soLuongTon > 0) or (book.trangThai == 'HetHang' or book.soLuongTon == null or book.soLuongTon <= 0)} ? 'max-w-[48%]' : 'max-w-[85%]'"
                class="absolute top-2 left-2 truncate px-2.5 py-0.5 rounded-full bg-surface-container-lowest/95 backdrop-blur-sm text-[11px] font-bold text-primary shadow-xs whitespace-nowrap z-10">
                Văn học
            </span>

            <!-- Stock status indicator -->
            <span th:if="${book.trangThai != 'HetHang' and book.soLuongTon != null and book.soLuongTon <= 5 and book.soLuongTon > 0}"
                class="absolute top-2 right-2 px-2 py-0.5 rounded-full bg-secondary text-on-secondary text-[10px] font-bold shadow-xs whitespace-nowrap z-10">
                Chỉ còn <span th:text="${book.soLuongTon}"></span> sản phẩm
            </span>
            <span th:if="${book.trangThai == 'HetHang' or book.soLuongTon == null or book.soLuongTon <= 0}"
                class="absolute top-2 right-2 px-2 py-0.5 rounded-full bg-rose-600 text-white text-[10px] font-bold shadow-xs whitespace-nowrap z-10">
                Hết hàng
            </span>
        </a>

        <!-- Book Meta -->
        <div class="flex-1 flex flex-col justify-between">
            <div>
                <a th:href="@{/san-pham/{id}(id=${book.maSP})}">
                    <h3 th:text="${book.tenSP}"
                        class="font-headline-sm text-sm font-bold text-on-surface line-clamp-2 leading-snug group-hover:text-primary transition-colors min-h-[2.6rem]">
                        Tên Sản Phẩm
                    </h3>
                </a>
                <p class="text-xs text-on-surface-variant mt-1 truncate block"
                   th:title="${(book.danhSachTacGia != null ? book.danhSachTacGia : '') + (book.nhaXuatBan != null ? ' • ' + book.nhaXuatBan.tenNXB : '')}">
                    <span th:if="${book.danhSachTacGia != null and !book.danhSachTacGia.isEmpty()}" 
                          class="font-medium text-primary"
                          th:text="${book.danhSachTacGia}">Tác giả</span>
                    <span th:if="${book.danhSachTacGia != null and !book.danhSachTacGia.isEmpty() and book.nhaXuatBan != null}" class="text-outline text-[10px] mx-1">•</span>
                    <span th:if="${book.nhaXuatBan != null}" 
                          th:text="${book.nhaXuatBan.tenNXB}" 
                          class="text-on-surface-variant/80">Nhà Xuất Bản</span>
                    <span th:if="${(book.danhSachTacGia == null or book.danhSachTacGia.isEmpty()) and book.nhaXuatBan == null}">The4BookStore Tuyển Chọn</span>
                </p>

                <div class="flex items-center justify-between gap-1 mt-2 text-[11px] text-on-surface-variant">
                    <a th:if="${book.shop != null}" th:href="@{'/shop/' + ${book.shop.slug}}" class="text-amber-800 hover:text-amber-950 hover:underline font-semibold flex items-center gap-1 truncate max-w-[130px]" th:title="${book.shop.tenShop}">
                        <span class="material-symbols-outlined text-[13px] text-amber-700">storefront</span>
                        <span th:text="${book.shop.tenShop}" class="truncate">The4BookStore Official</span>
                    </a>
                    <span th:if="${book.shop == null}"></span>
                    <span th:if="${book.soLuongDaBan != null and book.soLuongDaBan > 0}" class="text-on-surface-variant font-medium shrink-0 ml-auto flex items-center gap-0.5">
                        Đã bán <span class="font-bold text-primary font-mono" th:text="${book.soLuongDaBan}">0</span>
                    </span>
                    <span th:unless="${book.soLuongDaBan != null and book.soLuongDaBan > 0}" class="text-on-surface-variant/50 text-[10px] shrink-0 ml-auto">
                        Mới ra mắt
                    </span>
                </div>
            </div>

            <!-- Price & Buy Action -->
            <div class="pt-3 mt-3 border-t border-surface-container-low flex items-center justify-between">
                <div>
                    <span class="text-[10px] text-outline block">Giá niêm yết</span>
                    <span th:text="${book.giaBan != null ? #numbers.formatDecimal(book.giaBan, 0, 'POINT', 0, 'COMMA') + ' đ' : '189.000 đ'}"
                        class="font-mono font-bold text-sm text-primary">
                        189.000 đ
                    </span>
                </div>
                <div class="flex items-center gap-1.5">
                    <a th:href="@{/san-pham/{id}(id=${book.maSP})}"
                        class="p-2 rounded-xl bg-surface-container text-primary hover:bg-surface-container-high transition-all shadow-xs flex items-center justify-center"
                        title="Xem chi tiết sản phẩm">
                        <span class="material-symbols-outlined text-[18px]">visibility</span>
                    </a>
                    <button type="button"
                        th:if="${book.trangThai != 'HetHang' and (book.soLuongTon == null or book.soLuongTon > 0)}"
                        th:onclick="'quickAddToCart(' + ${book.maSP} + ', 1, event)'"
                        class="p-2 rounded-xl bg-primary text-on-primary hover:bg-primary-container transition-all shadow-xs flex items-center justify-center cursor-pointer border-0 active:scale-95"
                        title="Thêm vào giỏ hàng">
                        <span class="material-symbols-outlined text-[18px]">add_shopping_cart</span>
                    </button>
                </div>
            </div>
        </div>
    </article>

</body>

</html>
