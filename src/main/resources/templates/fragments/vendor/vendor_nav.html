<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- Unified Vendor Portal Secondary Navbar -->
    <nav th:fragment="vendor_navbar(activeTab)" class="bg-surface-container-lowest rounded-2xl shadow-xs border border-surface-container p-2 mb-6 transition-all">
        <div class="flex items-center justify-between gap-2 flex-wrap">
            <!-- Nav Items Links -->
            <div class="flex items-center gap-1 sm:gap-1.5 overflow-x-auto no-scrollbar py-1">
                <!-- 1. Tổng quan -->
                <a th:href="@{/vendor/dashboard}"
                   th:class="${activeTab == 'dashboard'} ?
                            'inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-bold bg-primary text-on-primary shadow-xs transition-all' :
                            'inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-all'">
                    <span class="material-symbols-outlined text-[18px]">dashboard</span>
                    <span>Tổng Quan</span>
                </a>

                <!-- 2. Sản phẩm -->
                <a th:href="@{/vendor/products}"
                   th:class="${activeTab == 'products'} ?
                            'inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-bold bg-primary text-on-primary shadow-xs transition-all' :
                            'inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-all'">
                    <span class="material-symbols-outlined text-[18px]">menu_book</span>
                    <span>Sản Phẩm</span>
                </a>

                <!-- 3. Nhập hàng -->
                <a th:href="@{/vendor/imports}"
                   th:class="${activeTab == 'imports'} ?
                            'inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-bold bg-primary text-on-primary shadow-xs transition-all' :
                            'inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-all'">
                    <span class="material-symbols-outlined text-[18px]">input</span>
                    <span>Nhập Hàng</span>
                </a>

                <!-- 4. Kiểm kê kho -->
                <a th:href="@{/vendor/inventory}"
                   th:class="${activeTab == 'inventory'} ?
                            'inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-bold bg-emerald-600 text-white shadow-xs transition-all' :
                            'inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold text-on-surface-variant hover:text-emerald-700 hover:bg-emerald-50 transition-all'">
                    <span class="material-symbols-outlined text-[18px]">fact_check</span>
                    <span>Kiểm Kê Kho</span>
                    <span th:class="${activeTab == 'inventory'} ? 'text-[10px] uppercase font-extrabold px-1.5 py-0.5 rounded-full bg-white/20 text-white' : 'text-[10px] uppercase font-bold px-1.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800'">Tự Quản</span>
                </a>

                <!-- 4. Đơn hàng -->
                <a th:href="@{/vendor/orders}"
                   th:class="${activeTab == 'orders'} ?
                            'relative inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-bold bg-primary text-on-primary shadow-xs transition-all' :
                            'relative inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-all'">
                    <span class="material-symbols-outlined text-[18px]">local_shipping</span>
                    <span>Đơn Hàng</span>
                    <span id="vendor-order-badge" class="hidden px-1.5 py-0.5 rounded-full text-[10px] font-black bg-rose-500 text-white animate-pulse">0</span>
                </a>

                <!-- 5. Mã giảm giá / Voucher -->
                <a th:href="@{/vendor/promotions}"
                   th:class="${activeTab == 'promotions'} ?
                            'inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-bold bg-primary text-on-primary shadow-xs transition-all' :
                            'inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-all'">
                    <span class="material-symbols-outlined text-[18px]">confirmation_number</span>
                    <span>Mã Giảm Giá</span>
                </a>

                <!-- 6. Cài đặt Shop -->
                <a th:href="@{/vendor/profile}"
                   th:class="${activeTab == 'profile'} ?
                            'inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-bold bg-primary text-on-primary shadow-xs transition-all' :
                            'inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-all'">
                    <span class="material-symbols-outlined text-[18px]">store</span>
                    <span>Cài Đặt Shop</span>
                </a>
            </div>

            <!-- Right Quick Action: View Live Shop -->
            <div class="hidden md:flex items-center gap-2 pr-1" th:if="${(shop != null and shop.slug != null and shop.trangThai == 'HoatDong') or (currentShop != null and currentShop.slug != null and currentShop.trangThai == 'HoatDong')}">
                <a th:href="@{'/shop/' + ${(shop != null ? shop.slug : currentShop.slug)}}" target="_blank"
                   class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold text-primary hover:bg-primary/10 border border-primary/20 transition-all">
                    <span class="material-symbols-outlined text-[16px]">open_in_new</span>
                    <span>Xem Gian Hàng</span>
                </a>
            </div>
        </div>

        <!-- TOAST NOTIFICATION CONTAINER CHO VENDOR REAL-TIME -->
        <div id="vendor-ws-toast-container" class="fixed top-24 right-4 sm:right-8 z-50 flex flex-col gap-3 pointer-events-none max-w-sm w-full"></div>

        <!-- WEBSOCKET STOMP SCRIPT CHO VENDOR -->
        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', function () {
                const currentShopId = /*[[${shop != null ? shop.maShop : (currentShop != null ? currentShop.maShop : null)}]]*/ null;
                if (!currentShopId) return;

                if (typeof SockJS === 'undefined' || typeof Stomp === 'undefined') {
                    console.warn("Chưa tải thư viện SockJS/STOMP");
                    return;
                }

                try {
                    const socket = new SockJS('/ws');
                    const stompClient = Stomp.over(socket);
                    stompClient.debug = null; // Tắt log debug STOMP trên console

                    stompClient.connect({}, function () {
                        // Subscribe đúng kênh của shop này
                        stompClient.subscribe('/topic/vendor/' + currentShopId + '/orders', function (message) {
                            try {
                                const noti = JSON.parse(message.body);
                                showVendorOrderToast(noti);

                                // Cập nhật badge số đơn mới
                                const badge = document.getElementById('vendor-order-badge');
                                if (badge) {
                                    let currentCount = parseInt(badge.textContent || '0', 10);
                                    badge.textContent = (currentCount + 1);
                                    badge.classList.remove('hidden');
                                }
                            } catch (e) {
                                console.error("Lỗi đọc gói tin WebSocket vendor:", e);
                            }
                        });
                    }, function (err) {
                        console.warn("WebSocket vendor reconnect sau 5s...", err);
                    });

                    function showVendorOrderToast(noti) {
                        const container = document.getElementById('vendor-ws-toast-container');
                        if (!container) return;

                        // Âm thanh thông báo nhẹ nhàng nếu browser hỗ trợ Web Audio
                        try {
                            const ctx = new (window.AudioContext || window.webkitAudioContext)();
                            const osc = ctx.createOscillator();
                            const gain = ctx.createGain();
                            osc.connect(gain);
                            gain.connect(ctx.destination);
                            osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
                            osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1); // A5
                            gain.gain.setValueAtTime(0.15, ctx.currentTime);
                            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                            osc.start();
                            osc.stop(ctx.currentTime + 0.4);
                        } catch (e) {}

                        const toast = document.createElement('div');
                        toast.className = 'pointer-events-auto bg-surface-container-lowest text-on-surface border-2 border-emerald-500 shadow-2xl rounded-2xl p-4 flex items-start gap-3.5 transform transition-all duration-300 translate-y-4 opacity-0 ring-4 ring-emerald-500/20';
                        
                        const formatVND = noti.tongTien ? new Intl.NumberFormat('vi-VN').format(noti.tongTien) + ' ₫' : '';

                        toast.innerHTML = `
                            <div class="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center flex-shrink-0 shadow-sm animate-bounce">
                                <span class="material-symbols-outlined text-[24px]">notifications_active</span>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center justify-between">
                                    <span class="font-black text-sm text-emerald-800">🎉 ĐƠN HÀNG MỚI #${noti.maDH}</span>
                                    <span class="text-[11px] text-on-surface-variant font-medium">Vừa xong</span>
                                </div>
                                <p class="text-xs text-on-surface mt-1 font-semibold">Khách: <span class="text-on-surface">${noti.tenKhachHang || 'Khách hàng'}</span> - <strong class="text-emerald-700 text-sm">${formatVND}</strong></p>
                                <p class="text-[11px] text-on-surface-variant truncate max-w-[220px] mt-0.5">${noti.diaChiGiao || ''}</p>
                                <div class="mt-2.5 flex items-center gap-2">
                                    <a href="/vendor/orders" class="inline-flex items-center gap-1 text-xs bg-emerald-700 text-white px-3 py-1 rounded-lg font-bold hover:bg-emerald-800 transition-colors shadow-xs">
                                        <span>Xem & Xử lý đơn</span>
                                        <span class="material-symbols-outlined text-[14px]">arrow_forward</span>
                                    </a>
                                </div>
                            </div>
                            <button type="button" class="text-on-surface-variant hover:text-on-surface p-1 rounded-lg hover:bg-surface-container transition-colors" onclick="this.parentElement.remove()">
                                <span class="material-symbols-outlined text-[18px]">close</span>
                            </button>
                        `;

                        container.appendChild(toast);

                        requestAnimationFrame(() => {
                            toast.classList.remove('translate-y-4', 'opacity-0');
                        });

                        // Tự đóng sau 10 giây
                        setTimeout(() => {
                            toast.classList.add('translate-y-4', 'opacity-0');
                            setTimeout(() => toast.remove(), 300);
                        }, 10000);
                    }
                } catch (err) {
                    console.warn("Lỗi khởi tạo WebSocket vendor:", err);
                }
            });
        </script>
    </nav>

</body>
</html>
