<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- Unified Vendor Portal Secondary Navbar -->
    <nav th:fragment="vendor_navbar(activeTab)" class="bg-surface-container-lowest rounded-2xl shadow-xs border border-surface-container p-2 mb-6 transition-all">
        <div class="flex items-center justify-between gap-2 flex-wrap">
            <!-- Nav Items Links -->
            <div class="flex items-center gap-1 sm:gap-1.5 overflow-x-auto no-scrollbar py-1">
                <!-- 1. Tổng quan -->
                <a th:href="@{/vendor/dashboard}"
                   th:class="${activeTab == 'dashboard'} ?
                            'inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-bold bg-primary text-on-primary shadow-xs transition-all' :
                            'inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-all'">
                    <span class="material-symbols-outlined text-[18px]">dashboard</span>
                    <span>Tổng Quan</span>
                </a>

                <!-- 2. Sản phẩm -->
                <a th:href="@{/vendor/products}"
                   th:class="${activeTab == 'products'} ?
                            'inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-bold bg-primary text-on-primary shadow-xs transition-all' :
                            'inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-all'">
                    <span class="material-symbols-outlined text-[18px]">inventory_2</span>
                    <span>Sản Phẩm</span>
                </a>

                <!-- 3. Kiểm kê kho -->
                <a th:href="@{/vendor/inventory}"
                   th:class="${activeTab == 'inventory'} ?
                            'inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-bold bg-emerald-600 text-white shadow-xs transition-all' :
                            'inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold text-on-surface-variant hover:text-emerald-700 hover:bg-emerald-50 transition-all'">
                    <span class="material-symbols-outlined text-[18px]">fact_check</span>
                    <span>Kiểm Kê Kho</span>
                    <span th:class="${activeTab == 'inventory'} ? 'text-[10px] uppercase font-extrabold px-1.5 py-0.5 rounded-full bg-white/20 text-white' : 'text-[10px] uppercase font-bold px-1.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800'">Tự Quản</span>
                </a>

                <!-- 4. Đơn hàng -->
                <a th:href="@{/vendor/orders}"
                   th:class="${activeTab == 'orders'} ?
                            'relative inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-bold bg-primary text-on-primary shadow-xs transition-all' :
                            'relative inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-all'">
                    <span class="material-symbols-outlined text-[18px]">local_shipping</span>
                    <span>Đơn Hàng</span>
                    <span id="vendor-order-badge" class="hidden px-1.5 py-0.5 rounded-full text-[10px] font-black bg-rose-500 text-white animate-pulse">0</span>
                </a>

                <!-- 5. Mã giảm giá / Voucher -->
                <a th:href="@{/vendor/promotions}"
                   th:class="${activeTab == 'promotions'} ?
                            'inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-bold bg-primary text-on-primary shadow-xs transition-all' :
                            'inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-all'">
                    <span class="material-symbols-outlined text-[18px]">confirmation_number</span>
                    <span>Mã Giảm Giá</span>
                </a>

                <!-- 6. Cài đặt Shop -->
                <a th:href="@{/vendor/profile}"
                   th:class="${activeTab == 'profile'} ?
                            'inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-bold bg-primary text-on-primary shadow-xs transition-all' :
                            'inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-all'">
                    <span class="material-symbols-outlined text-[18px]">store</span>
                    <span>Cài Đặt Shop</span>
                </a>
            </div>

            <!-- Right Quick Action: View Live Shop -->
            <div class="hidden md:flex items-center gap-2 pr-1" th:if="${(shop != null and shop.slug != null and shop.trangThai == 'HoatDong') or (currentShop != null and currentShop.slug != null and currentShop.trangThai == 'HoatDong')}">
                <a th:href="@{'/shop/' + ${(shop != null ? shop.slug : currentShop.slug)}}"
                   class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold text-primary hover:bg-primary/10 border border-primary/20 transition-all">
                    <span class="material-symbols-outlined text-[16px]">storefront</span>
                    <span>Xem Gian Hàng</span>
                </a>
            </div>
        </div>

        <!-- TOAST NOTIFICATION CONTAINER CHO VENDOR REAL-TIME -->
        <div id="vendor-ws-toast-container" class="fixed top-24 right-4 sm:right-8 z-50 flex flex-col gap-3 pointer-events-none max-w-sm w-full"></div>
    </nav>

</body>
</html>
