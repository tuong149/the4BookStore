<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common/head :: common_head('Tạo Yêu Cầu Cấp Hàng - Kênh Người Bán')}"></head>

<body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col">

    <header th:replace="~{fragments/common/navbar :: common_navbar('vendor')}"></header>

    <main class="w-full pt-28 pb-16 flex-1 max-w-4xl mx-auto px-4 md:px-8">
        <nav th:replace="~{fragments/vendor/vendor_nav :: vendor_navbar('inventory')}"></nav>

        <div class="mb-6">
            <nav class="text-xs text-on-surface-variant flex items-center gap-1 mb-1">
                <a th:href="@{/vendor/dashboard}" class="hover:underline">Kênh người bán</a>
                <span class="material-symbols-outlined text-xs">chevron_right</span>
                <a th:href="@{/vendor/stock-requests}" class="hover:underline">Yêu cầu cấp hàng</a>
                <span class="material-symbols-outlined text-xs">chevron_right</span>
                <span class="text-primary font-semibold">Tạo mới</span>
            </nav>
            <h1 class="text-2xl font-bold text-on-surface">Phiếu Yêu Cầu Cấp Hàng Từ Kho Tổng</h1>
            <p class="text-xs text-on-surface-variant mt-1">Đề xuất xuất kho từ Kho Tổng sang gian hàng để bổ sung tồn kho cho các sản phẩm sắp hết.</p>
        </div>

        <div th:if="${errorMessage}" class="mb-6 p-4 rounded-2xl bg-rose-50 border border-rose-200 text-rose-800 text-xs font-bold flex items-center gap-2">
            <span class="material-symbols-outlined text-rose-600">error</span>
            <span th:text="${errorMessage}"></span>
        </div>

        <div class="bg-surface-container-lowest p-6 rounded-3xl border border-surface-container shadow-sm">
            <form th:action="@{/vendor/stock-requests/create}" method="post" class="space-y-6">
                <!-- Chọn Kho Tổng -->
                <div>
                    <label class="block text-xs font-bold uppercase text-on-surface-variant mb-1">Chọn Kho Tổng Cung Cấp <span class="text-error">*</span></label>
                    <select name="maKho" required class="w-full px-4 py-2.5 rounded-xl border border-surface-container bg-surface-container-low text-xs focus:ring-2 focus:ring-primary font-semibold">
                        <option th:each="k : ${khos}" th:value="${k.maKho}" th:text="${k.tenKho} + ' (' + ${k.diaChi} + ')'"></option>
                    </select>
                </div>

                <!-- Ghi chú -->
                <div>
                    <label class="block text-xs font-bold uppercase text-on-surface-variant mb-1">Ghi Chú Yêu Cầu</label>
                    <input type="text" name="ghiChu" placeholder="Ví dụ: Cần bổ sung gấp trước đợt khuyến mãi..."
                           class="w-full px-4 py-2.5 rounded-xl border border-surface-container bg-surface-container-low text-xs focus:ring-2 focus:ring-primary"/>
                </div>

                <!-- Danh sách sản phẩm đề xuất -->
                <div>
                    <div class="flex items-center justify-between mb-3">
                        <label class="block text-xs font-bold uppercase text-on-surface">Danh Sách Mặt Hàng Cần Cấp Tồn Kho</label>
                        <button type="button" onclick="addProductRow()" class="px-3 py-1.5 rounded-xl bg-primary/10 text-primary hover:bg-primary hover:text-white font-bold text-xs transition-all flex items-center gap-1">
                            <span class="material-symbols-outlined text-sm">add</span>
                            <span>Thêm dòng sản phẩm</span>
                        </button>
                    </div>

                    <div class="border border-surface-container rounded-2xl overflow-hidden">
                        <table class="w-full text-left text-xs" id="itemsTable">
                            <thead class="bg-surface-container-low text-on-surface-variant uppercase font-bold text-[11px] border-b border-surface-container">
                                <tr>
                                    <th class="p-3 w-7/12">Tên Sản Phẩm Trong Gian Hàng</th>
                                    <th class="p-3 w-3/12">Số Lượng Cần Cấp</th>
                                    <th class="p-3 w-2/12 text-center">Xóa</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-surface-container" id="itemsTableBody">
                                <tr>
                                    <td class="p-3">
                                        <select name="productIds" required class="w-full px-3 py-2 rounded-xl border border-surface-container bg-surface-container-low text-xs">
                                            <option value="" disabled selected>-- Chọn sản phẩm cần cấp --</option>
                                            <option th:each="p : ${products}" th:value="${p.maSP}" th:text="${p.tenSP} + ' (Tồn hiện tại: ' + ${p.soLuongTon} + ')'"></option>
                                        </select>
                                    </td>
                                    <td class="p-3">
                                        <input type="number" name="quantities" required min="1" value="10" placeholder="Số lượng"
                                               class="w-full px-3 py-2 rounded-xl border border-surface-container bg-surface-container-low text-xs font-bold text-primary"/>
                                    </td>
                                    <td class="p-3 text-center">
                                        <button type="button" onclick="removeProductRow(this)" class="p-1 text-rose-500 hover:bg-rose-50 rounded-lg transition-colors">
                                            <span class="material-symbols-outlined text-[18px]">delete</span>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="pt-4 border-t border-surface-container flex items-center justify-end gap-3">
                    <a th:href="@{/vendor/stock-requests}" class="px-5 py-2.5 rounded-xl bg-surface-container text-xs font-bold hover:bg-surface-container-high transition-all">Quay Lại</a>
                    <button type="submit" class="px-6 py-2.5 rounded-xl bg-primary text-on-primary text-xs font-bold hover:bg-primary-container shadow-sm transition-all flex items-center gap-1.5">
                        <span class="material-symbols-outlined text-sm">send</span>
                        <span>Gửi Yêu Cầu Lên Tổng Bộ</span>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer th:replace="~{fragments/common/footer :: common_footer}"></footer>

    <script>
        function addProductRow() {
            const tbody = document.getElementById('itemsTableBody');
            const firstRow = tbody.querySelector('tr');
            if (!firstRow) return;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="p-3">
                    ${firstRow.querySelector('td:first-child').innerHTML}
                </td>
                <td class="p-3">
                    <input type="number" name="quantities" required min="1" value="10" placeholder="Số lượng"
                           class="w-full px-3 py-2 rounded-xl border border-surface-container bg-surface-container-low text-xs font-bold text-primary"/>
                </td>
                <td class="p-3 text-center">
                    <button type="button" onclick="removeProductRow(this)" class="p-1 text-rose-500 hover:bg-rose-50 rounded-lg transition-colors">
                        <span class="material-symbols-outlined text-[18px]">delete</span>
                    </button>
                </td>
            `;

            // Reset select value on newly created row
            const newSelect = tr.querySelector('select');
            if (newSelect) {
                newSelect.selectedIndex = 0;
            }

            tbody.appendChild(tr);
        }

        function removeProductRow(btn) {
            const tbody = document.getElementById('itemsTableBody');
            if (tbody.querySelectorAll('tr').length <= 1) {
                alert('Phải có ít nhất 1 dòng sản phẩm yêu cầu cấp hàng!');
                return;
            }
            btn.closest('tr').remove();
        }
    </script>
</body>
</html>
