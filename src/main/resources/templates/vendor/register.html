<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/common/head :: common_head('Đăng Ký Mở Shop - Kênh Người Bán The4BookStore')}"></head>

<body class="bg-surface font-body-md text-body-md text-on-surface antialiased min-h-screen flex flex-col">

    <header th:replace="~{fragments/common/navbar :: common_navbar('vendor')}"></header>

    <main class="w-full pt-28 pb-16 flex-1 flex items-center justify-center">
        <div class="max-w-2xl w-full mx-auto px-4">
            <div class="bg-surface-container-lowest p-8 rounded-3xl shadow-xl border border-surface-container">
                <div class="text-center mb-8">
                    <div class="w-16 h-16 bg-primary/10 text-primary rounded-2xl flex items-center justify-center mx-auto mb-4">
                        <span class="material-symbols-outlined text-4xl">storefront</span>
                    </div>
                    <h1 class="text-2xl font-bold text-on-surface">Đăng Ký Mở Gian Hàng Sách</h1>
                    <p class="text-sm text-on-surface-variant mt-2">Trở thành đối tác bán sách cùng The4BookStore, tiếp cận hàng triệu bạn đọc toàn quốc.</p>
                </div>

                <div th:if="${errorMessage}" class="mb-6 p-4 rounded-xl bg-error/10 border border-error/20 text-error text-sm font-semibold flex items-center gap-2">
                    <span class="material-symbols-outlined">error</span>
                    <span th:text="${errorMessage}"></span>
                </div>

                <form th:action="@{/vendor/register}" method="post" class="space-y-5">
                    <div>
                        <label class="block text-xs font-bold uppercase text-on-surface-variant mb-1">Tên Gian Hàng / Nhà Sách <span class="text-error">*</span></label>
                        <input type="text" name="tenShop" required placeholder="Ví dụ: Nhà Sách Trí Tuệ"
                               class="w-full px-4 py-3 rounded-xl border border-surface-container bg-surface-container-low text-on-surface focus:outline-none focus:ring-2 focus:ring-primary text-sm font-medium"/>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase text-on-surface-variant mb-1">Mô Tả Ngắn Gian Hàng</label>
                        <textarea name="moTa" rows="3" placeholder="Giới thiệu về sách, chuyên ngành hoặc định hướng của shop..."
                                  class="w-full px-4 py-3 rounded-xl border border-surface-container bg-surface-container-low text-on-surface focus:outline-none focus:ring-2 focus:ring-primary text-sm font-medium"></textarea>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase text-on-surface-variant mb-1">Số Điện Thoại Liên Hệ <span class="text-error">*</span></label>
                            <input type="tel" name="soDienThoai" required placeholder="0901234567"
                                   class="w-full px-4 py-3 rounded-xl border border-surface-container bg-surface-container-low text-on-surface focus:outline-none focus:ring-2 focus:ring-primary text-sm font-medium"/>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase text-on-surface-variant mb-1">Email Gian Hàng <span class="text-error">*</span></label>
                            <input type="email" name="emailShop" required placeholder="shop@domain.com"
                                   class="w-full px-4 py-3 rounded-xl border border-surface-container bg-surface-container-low text-on-surface focus:outline-none focus:ring-2 focus:ring-primary text-sm font-medium"/>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold uppercase text-on-surface-variant mb-1">Địa Chỉ Kho Hàng / Cửa Hàng <span class="text-error">*</span></label>
                        <input type="text" name="diaChiShop" required placeholder="Số nhà, tên đường, Phường/Xã, Quận/Huyện, Tỉnh/TP"
                               class="w-full px-4 py-3 rounded-xl border border-surface-container bg-surface-container-low text-on-surface focus:outline-none focus:ring-2 focus:ring-primary text-sm font-medium"/>
                    </div>

                    <div class="p-4 rounded-xl bg-surface-container text-xs text-on-surface-variant flex items-start gap-3">
                        <span class="material-symbols-outlined text-primary text-lg">info</span>
                        <div>
                            <p class="font-bold text-on-surface">Chính sách phí sàn The4BookStore:</p>
                            <p>Phí dịch vụ mặc định là <strong>5.0%</strong> áp dụng trên mỗi đơn hàng giao thành công. Sàn sẽ kiểm duyệt hồ sơ của bạn trong vòng 24h.</p>
                        </div>
                    </div>

                    <button type="submit" class="w-full py-3.5 bg-primary text-on-primary font-bold text-sm rounded-xl hover:bg-primary-container shadow-md transition-all flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined">send</span>
                        <span>Gửi Hồ Sơ Đăng Ký Gian Hàng</span>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/common/footer :: common_footer}"></footer>
</body>
</html>
