<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common/head :: common_head('Xác thực OTP & Đặt lại mật khẩu - The4BookStore')}"></head>

<body class="min-h-screen w-screen bg-[#eaedf1] flex items-center justify-center p-1.5 sm:p-2.5 md:p-3 font-body-md antialiased selection:bg-primary selection:text-white overflow-hidden">

    <!-- Main Container Card with Bookshelf Background -->
    <main class="relative w-[98vw] h-[96vh] min-h-[660px] rounded-[24px] sm:rounded-[36px] overflow-hidden shadow-2xl border border-white/50 bg-cover bg-center flex items-center justify-end pr-4 sm:pr-8 md:pr-12 lg:pr-16"
          th:style="|background-image: url('@{/images/login-bookshelf.jpg}');|">
        
        <!-- Subtle ambient shade -->
        <div class="absolute inset-0 bg-black/10 pointer-events-none"></div>

        <!-- Glassmorphism Card -->
        <div class="relative z-10 w-full sm:max-w-lg lg:w-[540px] xl:w-[580px] my-auto bg-white/50 backdrop-blur-xl backdrop-saturate-150 rounded-[32px] sm:rounded-[40px] p-8 sm:p-10 md:p-12 shadow-[0_25px_60px_-15px_rgba(0,0,0,0.4)] border border-white/80 ring-1 ring-black/5 flex flex-col justify-between">
            
            <!-- Brand Logo Header -->
            <div class="flex items-center justify-center gap-3.5 pt-1">
                <div class="w-12 h-12 rounded-2xl bg-primary text-on-primary flex items-center justify-center shadow-md shrink-0">
                    <span class="material-symbols-outlined text-[28px]">lock_reset</span>
                </div>
                <div class="flex flex-col text-left">
                    <span class="font-headline-sm text-base sm:text-lg font-black text-primary tracking-wider leading-tight drop-shadow-sm">THE4BOOKSTORE</span>
                    <span class="font-headline-sm text-[10px] sm:text-[11px] font-extrabold text-primary tracking-widest uppercase leading-none mt-1">Xác Thực Mã OTP</span>
                </div>
            </div>

            <!-- Main Heading & Subtitle -->
            <div class="text-center my-3 sm:my-4">
                <h1 class="font-headline-xl text-3xl sm:text-4xl md:text-[36px] font-black text-primary tracking-tight drop-shadow-sm">
                    XÁC THỰC MÃ OTP
                </h1>
                <p class="text-xs sm:text-sm text-slate-800 font-semibold mt-1 max-w-md mx-auto leading-relaxed drop-shadow-[0_1px_1px_rgba(255,255,255,0.7)]">
                    Mã xác thực OTP (6 chữ số) đã được gửi đến:<br/>
                    <span class="font-black text-primary text-sm sm:text-base underline" th:text="${email}">email@example.com</span>
                </p>
            </div>

            <!-- Feedback Alerts -->
            <div th:if="${error}" class="mb-3 px-4 py-2.5 rounded-2xl bg-white/95 border-2 border-error/50 text-error text-xs sm:text-sm font-bold flex items-center gap-2 shadow-md animate-in fade-in duration-300">
                <span class="material-symbols-outlined text-[18px] shrink-0">error</span>
                <span th:text="${error}">Thông báo lỗi</span>
            </div>

            <div th:if="${success}" class="mb-3 px-4 py-2.5 rounded-2xl bg-white/95 border-2 border-primary/50 text-primary text-xs sm:text-sm font-bold flex items-center gap-2 shadow-md animate-in fade-in duration-300">
                <span class="material-symbols-outlined text-[18px] shrink-0">mark_email_read</span>
                <span th:text="${success}">Mã OTP đã được gửi đến email!</span>
            </div>


            <!-- Reset Password Form with OTP -->
            <form th:action="@{/reset-password}" method="post" id="resetForm" class="space-y-3.5">
                <input type="hidden" name="email" th:value="${email}" />

                <!-- OTP 6 Digits Input -->
                <div>
                    <label for="otp" class="block text-xs font-bold text-slate-800 uppercase tracking-wider mb-1 text-center">
                        Nhập mã OTP 6 chữ số
                    </label>
                    <input type="text"
                           id="otp"
                           name="otp"
                           required
                           maxlength="6"
                           pattern="[0-9]{6}"
                           inputmode="numeric"
                           autocomplete="one-time-code"
                           placeholder="------"
                           class="w-full text-center font-mono text-2xl sm:text-3xl font-black tracking-[0.4em] sm:tracking-[0.5em] py-2.5 rounded-full border-2 border-primary focus:ring-4 focus:ring-primary/25 bg-white text-slate-900 placeholder:text-neutral-300 outline-none transition-all shadow-sm" />
                </div>

                <!-- New Password Input -->
                <div>
                    <input type="password"
                           id="password"
                           name="password"
                           required
                           minlength="6"
                           placeholder="Mật khẩu mới (tối thiểu 6 ký tự)..."
                           class="w-full px-6 py-3 rounded-full border-2 border-primary focus:ring-4 focus:ring-primary/25 bg-white text-slate-900 text-xs sm:text-sm font-semibold placeholder:text-neutral-500 outline-none transition-all duration-200 shadow-sm" />
                </div>

                <!-- Confirm New Password Input -->
                <div>
                    <input type="password"
                           id="confirmPassword"
                           name="confirmPassword"
                           required
                           minlength="6"
                           placeholder="Nhập lại mật khẩu mới..."
                           class="w-full px-6 py-3 rounded-full border-2 border-primary focus:ring-4 focus:ring-primary/25 bg-white text-slate-900 text-xs sm:text-sm font-semibold placeholder:text-neutral-500 outline-none transition-all duration-200 shadow-sm" />
                </div>

                <!-- Password Match Error Notice (Client-side) -->
                <div id="passwordMismatch" class="hidden px-4 py-2 rounded-xl bg-error/10 text-error text-xs font-bold flex items-center gap-1.5">
                    <span class="material-symbols-outlined text-[16px]">warning</span>
                    <span>Mật khẩu xác nhận không khớp!</span>
                </div>

                <!-- Submit Button -->
                <button type="submit"
                        class="w-full py-3.5 mt-1 bg-primary text-on-primary font-headline-sm text-base sm:text-lg font-bold rounded-full hover:bg-primary-container transition-all duration-200 shadow-lg hover:shadow-xl active:scale-[0.99] cursor-pointer tracking-wider flex items-center justify-center gap-2">
                    <span class="material-symbols-outlined text-[20px]">check_circle</span>
                    <span>Xác nhận &amp; Đổi mật khẩu</span>
                </button>
            </form>

            <!-- Resend OTP Section -->
            <form th:action="@{/resend-otp}" method="post" id="resendForm" class="text-center pt-2">
                <input type="hidden" name="email" th:value="${email}" />
                <button type="submit" id="resendBtn" class="text-xs sm:text-sm font-bold text-primary hover:underline transition-all cursor-pointer">
                    Chưa nhận được mã? Gửi lại OTP
                </button>
                <span id="countdownText" class="hidden text-xs text-slate-600 font-semibold">Gửi lại mã sau <span id="countdown">60</span>s</span>
            </form>

            <!-- Navigation Links -->
            <div class="text-center text-xs sm:text-sm text-slate-900 pt-2 font-semibold drop-shadow-[0_1px_1px_rgba(255,255,255,0.8)]">
                <span>Quay lại trang </span>
                <a th:href="@{/login}" class="font-black text-primary hover:underline transition-all">
                    Đăng nhập
                </a>
            </div>

            <div class="text-center pt-1">
                <a th:href="@{/}" class="inline-flex items-center gap-1 text-xs text-slate-800 hover:text-primary font-bold transition-colors drop-shadow-[0_1px_1px_rgba(255,255,255,0.8)]">
                    <span class="material-symbols-outlined text-[14px]">arrow_back</span>
                    <span>Quay về trang chủ</span>
                </a>
            </div>

        </div>

    </main>

    <!-- Client-side Validation & Countdown Script -->
    <script>
        const resetForm = document.getElementById('resetForm');
        if (resetForm) {
            const pwd = document.getElementById('password');
            const confirmPwd = document.getElementById('confirmPassword');
            const mismatchNotice = document.getElementById('passwordMismatch');

            resetForm.addEventListener('submit', function(e) {
                if (pwd.value !== confirmPwd.value) {
                    e.preventDefault();
                    mismatchNotice.classList.remove('hidden');
                    confirmPwd.focus();
                } else {
                    mismatchNotice.classList.add('hidden');
                }
            });

            confirmPwd.addEventListener('input', function() {
                if (pwd.value === confirmPwd.value) {
                    mismatchNotice.classList.add('hidden');
                }
            });
        }

        // Resend OTP Countdown logic (60 seconds)
        const resendForm = document.getElementById('resendForm');
        const resendBtn = document.getElementById('resendBtn');
        const countdownText = document.getElementById('countdownText');
        const countdownSpan = document.getElementById('countdown');

        if (resendForm && resendBtn && countdownText) {
            resendForm.addEventListener('submit', function() {
                resendBtn.classList.add('hidden');
                countdownText.classList.remove('hidden');
                let count = 60;
                countdownSpan.textContent = count;
                const timer = setInterval(() => {
                    count--;
                    countdownSpan.textContent = count;
                    if (count <= 0) {
                        clearInterval(timer);
                        resendBtn.classList.remove('hidden');
                        countdownText.classList.add('hidden');
                    }
                }, 1000);
            });
        }
    </script>

</body>
</html>
