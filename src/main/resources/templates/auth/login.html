<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common/head :: common_head('Đăng nhập - The4BookStore')}"></head>

<body class="min-h-screen bg-slate-900/10 flex items-center justify-center p-3 sm:p-6 md:p-10 font-body-md antialiased selection:bg-primary selection:text-white">

    <!-- Main Container Card with Bookshelf Background -->
    <main class="relative w-full max-w-5xl rounded-[32px] overflow-hidden shadow-2xl border border-white/40 bg-cover bg-center min-h-[620px] flex items-center justify-end"
          th:style="|background-image: url('@{/images/login-bookshelf.jpg}');|">
        
        <!-- Subtle gradient overlay on bookshelf image -->
        <div class="absolute inset-0 bg-gradient-to-r from-black/40 via-black/15 to-black/35 pointer-events-none"></div>

        <!-- Glassmorphism Login Card (Right Side) -->
        <div class="relative z-10 w-full sm:max-w-md lg:w-[48%] xl:w-[46%] m-3 sm:m-6 md:m-8 bg-white/90 backdrop-blur-md rounded-[28px] p-6 sm:p-8 md:p-9 shadow-2xl border border-white/70 flex flex-col justify-between">
            
            <!-- Brand Logo Header -->
            <div class="flex items-center justify-center gap-3 pt-1">
                <!-- Green Icon Box -->
                <div class="w-10 h-10 rounded-xl bg-primary text-on-primary flex items-center justify-center shadow-sm shrink-0">
                    <span class="material-symbols-outlined text-[24px]">menu_book</span>
                </div>
                <!-- Brand Title & Subtitle -->
                <div class="flex flex-col text-left">
                    <span class="font-headline-sm text-sm font-extrabold text-primary tracking-wide leading-tight">THE4BOOKSTORE</span>
                    <span class="font-headline-sm text-[9px] font-bold text-primary tracking-wider uppercase leading-none mt-0.5">Nhà Sách Trực Tuyến &amp; Quản Trị</span>
                </div>
            </div>

            <!-- Main Heading -->
            <h1 class="font-headline-xl text-3xl sm:text-4xl font-extrabold text-primary text-center tracking-tight my-4 sm:my-5">
                ĐĂNG NHẬP
            </h1>

            <!-- Feedback Alerts -->
            <div th:if="${param.error}" class="mb-3 px-4 py-2.5 rounded-2xl bg-error/10 border border-error/20 text-error text-xs font-semibold flex items-center gap-2 animate-in fade-in duration-300">
                <span class="material-symbols-outlined text-[18px]">error</span>
                <span>Sai tên đăng nhập hoặc mật khẩu!</span>
            </div>

            <div th:if="${param.logout}" class="mb-3 px-4 py-2.5 rounded-2xl bg-primary/10 border border-primary/20 text-primary text-xs font-semibold flex items-center gap-2 animate-in fade-in duration-300">
                <span class="material-symbols-outlined text-[18px]">check_circle</span>
                <span>Bạn đã đăng xuất thành công.</span>
            </div>

            <div th:if="${param.registered}" class="mb-3 px-4 py-2.5 rounded-2xl bg-primary/10 border border-primary/20 text-primary text-xs font-semibold flex items-center gap-2 animate-in fade-in duration-300">
                <span class="material-symbols-outlined text-[18px]">verified</span>
                <span>Đăng ký thành công! Vui lòng đăng nhập.</span>
            </div>

            <!-- Login Form -->
            <form th:action="@{/process-login}" method="post" class="space-y-3.5">
                <!-- Username Input -->
                <div>
                    <input type="text"
                           id="username"
                           name="username"
                           required
                           placeholder="Tên đăng nhập hoặc Email..."
                           class="w-full px-5 py-3 rounded-full border-2 border-primary/80 focus:border-primary focus:ring-4 focus:ring-primary/15 bg-white text-on-surface text-xs sm:text-sm font-medium placeholder:text-neutral-400 outline-none transition-all duration-200" />
                </div>

                <!-- Password Input -->
                <div>
                    <input type="password"
                           id="password"
                           name="password"
                           required
                           placeholder="Mật khẩu"
                           class="w-full px-5 py-3 rounded-full border-2 border-primary/80 focus:border-primary focus:ring-4 focus:ring-primary/15 bg-white text-on-surface text-xs sm:text-sm font-medium placeholder:text-neutral-400 outline-none transition-all duration-200" />
                </div>

                <!-- Remember Me & Forgot Password Row -->
                <div class="flex items-center justify-between text-xs px-2 pt-0.5 text-neutral-600">
                    <label class="flex items-center gap-2 cursor-pointer select-none">
                        <input type="checkbox"
                               name="remember-me"
                               id="remember-me"
                               class="w-4 h-4 rounded border-2 border-primary text-primary focus:ring-primary/30 cursor-pointer accent-primary" />
                        <span class="font-medium text-[11px] sm:text-xs">Ghi nhớ đăng nhập</span>
                    </label>
                    <a href="javascript:alert('Vui lòng liên hệ Admin qua email hỗ trợ để thiết lập lại mật khẩu.')"
                       class="text-[11px] sm:text-xs font-medium text-neutral-600 hover:text-primary transition-colors">
                        Quên mật khẩu
                    </a>
                </div>

                <!-- Submit Button -->
                <button type="submit"
                        class="w-full py-3 bg-primary text-on-primary font-headline-sm text-sm font-bold rounded-full hover:bg-primary-container transition-all duration-200 shadow-md hover:shadow-lg active:scale-[0.99] cursor-pointer tracking-wide">
                    Đăng nhập
                </button>
            </form>

            <!-- Divider -->
            <div class="relative my-3 text-center">
                <span class="text-xs text-neutral-500 font-medium">Hoặc</span>
            </div>

            <!-- Google OAuth Button -->
            <button type="button"
                    onclick="alert('Chức năng Đăng nhập bằng Google đang được tích hợp qua cổng OAuth2.')"
                    class="w-full py-2.5 border-2 border-primary text-primary hover:bg-primary/5 font-headline-sm text-xs font-bold rounded-full transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer active:scale-[0.99]">
                <!-- Google "G" Icon -->
                <svg class="w-4 h-4" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                </svg>
                <span>Đăng nhập với tài khoản Google</span>
            </button>

            <!-- Register Footer Link -->
            <div class="text-center text-xs text-neutral-600 pt-3">
                <span>Chưa có tài khoản? </span>
                <a th:href="@{/register}" class="font-bold text-primary hover:underline transition-all">
                    Đăng ký ngay
                </a>
            </div>

            <!-- Back to Home Floating Link -->
            <div class="text-center pt-2">
                <a th:href="@{/}" class="inline-flex items-center gap-1 text-[11px] text-neutral-500 hover:text-primary transition-colors">
                    <span class="material-symbols-outlined text-[14px]">arrow_back</span>
                    <span>Quay về trang chủ</span>
                </a>
            </div>

        </div>

    </main>

</body>
</html>
