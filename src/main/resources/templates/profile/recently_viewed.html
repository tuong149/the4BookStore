<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common/head :: common_head('Sách Đã Xem Gần Đây - The4BookStore')}"></head>

<body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col">

    <header th:replace="~{fragments/common/navbar :: common_navbar('profile')}"></header>

    <main class="w-full pt-28 pb-16 flex-1 max-w-7xl mx-auto px-4 md:px-8">
        <div class="mb-8 pb-4 border-b border-surface-container">
            <nav class="text-xs text-on-surface-variant flex items-center gap-1 mb-1">
                <a th:href="@{/profile}" class="hover:underline">Hồ sơ cá nhân</a>
                <span class="material-symbols-outlined text-xs">chevron_right</span>
                <span class="text-primary font-semibold">Lịch sử xem</span>
            </nav>
            <h1 class="text-2xl font-bold text-on-surface flex items-center gap-2">
                <span class="material-symbols-outlined text-amber-500">history</span>
                <span>Cuốn Sách Bạn Đã Xem Gần Đây</span>
            </h1>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
            <div th:each="book : ${recentlyViewed}">
                <div th:replace="~{fragments/common/book_card :: book_card(${book})}"></div>
            </div>
        </div>

        <div th:if="${recentlyViewed.isEmpty()}" class="p-16 text-center text-on-surface-variant bg-surface-container-lowest rounded-3xl border border-surface-container">
            <span class="material-symbols-outlined text-5xl text-amber-300 mb-2">visibility_off</span>
            <p class="font-bold text-sm text-on-surface">Chưa có lịch sử xem sách</p>
            <p class="text-xs mt-1">Khi bạn bấm vào xem chi tiết các cuốn sách, chúng sẽ tự động được lưu lại tại đây.</p>
        </div>
    </main>

    <footer th:replace="~{fragments/common/footer :: common_footer}"></footer>
</body>
</html>
