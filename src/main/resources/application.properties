spring.config.import=optional:file:.env[.properties]
spring.application.name=the4BookStore
server.port=${PORT:8080}

# Database Configuration (Using .env variables with fallback to local SQL Server)
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=QL_NhaSach;encrypt=true;trustServerCertificate=true;}
spring.datasource.username=${DB_USERNAME:the4book_user}
spring.datasource.password=${DB_PASSWORD:ChangeMe@2026}
spring.datasource.driver-class-name=${DB_DRIVER:com.microsoft.sqlserver.jdbc.SQLServerDriver}

# HikariCP Connection Pool Optimization
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.maximum-pool-size=12
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=The4BookStore-HikariCP

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.SQLServerDialect}
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Tomcat Thread & Resource Limits (Prevent thread explosion)
server.tomcat.threads.max=15
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=50
server.tomcat.accept-count=10
server.tomcat.max-http-form-post-size=5MB
server.tomcat.connection-timeout=20000

# Thymeleaf Configuration
spring.thymeleaf.cache=true
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.produce-partial-output-while-processing=false

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# JWT Configuration
jwt.secret=${JWT_SECRET:the4BookStore_SuperSecret_Jwt_Signing_Key_2026_DBMS330284_HCMUTE_Key}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
jwt.cookie-name=the4book_jwt
jwt.cookie-secure=${JWT_COOKIE_SECURE:false}

# VietQR Webhook Security Secret
vietqr.webhook-secret=${VIETQR_WEBHOOK_SECRET:}

# Mail Configuration (Gmail SMTP - Hỗ trợ chuẩn bảo mật mới TLSv1.2 & TLSv1.3)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2 TLSv1.3
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Cloudinary Image Cloud Storage
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Multipart Upload Configuration (Cho phép tải ảnh dung lượng lên tới 20MB)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# VietQR Dynamic QR Payment Configuration
vietqr.bank-id=${VIETQR_BANK_ID:TIMO}
vietqr.account-no=${VIETQR_ACCOUNT_NO:9021308251034}
vietqr.account-name=${VIETQR_ACCOUNT_NAME:THE4BOOKSTORE}
vietqr.template=${VIETQR_TEMPLATE:compact2}

# Tắt tự động chạy DataSeeder khi khởi động (Đổi thành true nếu muốn nạp lại dữ liệu mẫu)
app.seeder.enabled=false
