spring.config.import=optional:file:.env[.properties]
spring.application.name=the4BookStore

# Database Configuration (Using .env variables with fallback to local)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/QL_NhaSach?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

